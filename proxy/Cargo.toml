[package]
name = "telesignal-tunnel"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "telesignal-tunnel"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The WebSocket server. The library alone serves other front ends, such as the desktop app (`tauri/`).
server = ["tokio/rt-multi-thread", "tokio/signal", "tokio/sync", "dep:tokio-tungstenite", "dep:tungstenite"]

# Versions match the lockfile of the vendored libsignal (`rust/libsignal/Cargo.lock`)
[dependencies]
tokio = { version = "1.54.1", features = ["net", "time", "io-util", "macros"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, optional = true }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"], optional = true }
http = "1.4.2"
httparse = "1.10.1"
# Already in the tree through `tokio-tungstenite`: its `WebSocketStream` is a `futures` `Stream` and `Sink`
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
# Already in the tree through `tungstenite`: Base64 for `Proxy-Authorization`
data-encoding = "2.11.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The library's error types name their cases; `#[must_use]` on every getter adds noise
missing_errors_doc = "allow"
must_use_candidate = "allow"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
